# Cloud Run requires containers to listen on port 8080.
# This replaces the default nginx conf which listens on port 80.
server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback — app routes serve index.html.
    #
    # #31: this used to catch missing *files* too, which is how a portal with no
    # auth-ext.html in the image answered /auth-ext.html with the admin portal.
    # The extension's sign-in window then rendered the admin UI, called /me,
    # and showed "Access denied" instead of handing a token back. The two regex
    # blocks below take a request with a file extension out of this fallback, so
    # a missing file is a 404 and looks like one.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # app.js and styles.css keep the same names from one release to the next, so
    # a year-long immutable cache serves an old script beside new markup.
    # index.html is no-store and always arrives current; the script it loads was
    # not, so a browser that had ever opened the portal ran markup from this
    # release against behaviour from an older one. That shipped an Export button
    # calling a function its cached app.js had never heard of, and #45's fix
    # missing from a page that had been carrying it for weeks.
    #
    # no-cache does not mean "do not cache". The file is still stored; it must
    # be revalidated before reuse, so an unchanged asset costs a 304 and no
    # body. Correctness for a conditional request is the right trade here.
    #
    # This block sits before the immutable one because regex locations are
    # tried in order.
    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Images and fonts are fixed for the life of the page. If one is ever
    # replaced, give it a new name rather than moving it up to the block above.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Anything else that names a file — .html included — is that file or a 404.
    # Regex locations are tried in order, so this sits after the asset block and
    # only picks up what that one did not match.
    location ~ \.[^/]+$ {
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health check endpoint for Cloud Run
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Suppress noisy 404s for favicon
    location = /favicon.ico { log_not_found off; access_log off; }
}
