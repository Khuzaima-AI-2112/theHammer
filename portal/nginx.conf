# Cloud Run requires containers to listen on port 8080.
# This replaces the default nginx conf which listens on port 80.
server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback — app routes serve index.html.
    #
    # #31: this used to catch missing *files* too, which is how a portal with no
    # auth-ext.html in the image answered /auth-ext.html with the admin portal.
    # The extension's sign-in window then rendered the admin UI, called /me,
    # and showed "Access denied" instead of handing a token back. The two regex
    # blocks below take a request with a file extension out of this fallback, so
    # a missing file is a 404 and looks like one.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; HTML never cached (SPA re-checks on boot)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Anything else that names a file — .html included — is that file or a 404.
    # Regex locations are tried in order, so this sits after the asset block and
    # only picks up what that one did not match.
    location ~ \.[^/]+$ {
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health check endpoint for Cloud Run
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Suppress noisy 404s for favicon
    location = /favicon.ico { log_not_found off; access_log off; }
}
