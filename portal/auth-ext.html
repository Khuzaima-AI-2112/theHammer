<!DOCTYPE html>
<html>
<head>
  <title>The Hammer - Extension Login</title>
  <meta charset="utf-8">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.js"></script>
  <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.css" />
  <style>
    body { font-family: system-ui, sans-serif; background: #f7f6f2; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    #msg { font-weight: 600; margin-bottom: 20px; color: #01696f; }
  </style>
</head>
<body>
  <div id="msg">Authenticating with The Hammer...</div>
  <div id="firebaseui-auth-container"></div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDJYNBZUMaq1EQuySZMsqKGLoj3-YdZ0Fs",
      authDomain: "thehammer.firebaseapp.com",
      projectId: "thehammer",
      storageBucket: "thehammer.firebasestorage.app",
      messagingSenderId: "282689937365",
      appId: "1:282689937365:web:d87d9a37e7a5b3a28ca75c"
    };
    firebase.initializeApp(firebaseConfig);

    // Extensions this page is allowed to hand tokens to. Injected at build time
    // from the same allowlist the backend's CORS check reads as EXTENSION_ID
    // (backend/src/index.js, cloudbuild.yaml) — one source of truth, see #80
    // and #36.
    const ALLOWED_EXTENSION_IDS = '__EXTENSION_IDS__'.split(/[\s,]+/).filter(Boolean);

// The only legitimate redirect_uri is a chrome.identity.launchWebAuthFlow
// callback: https://<32-char extension id>.chromiumapp.org/. Anything else — a
// different scheme, a lookalike host, an id we were never told about — is not
// one of ours, and this page would otherwise hand it a Firebase ID token,
// refresh token and API key (#80).
function isAllowedRedirectUri(uriString, allowedIds) {
  let url;
  try {
    url = new URL(uriString);
  } catch {
    return false;
  }
  if (url.protocol !== 'https:') return false;
  const match = url.hostname.match(/^([a-p]{32})\.chromiumapp\.org$/);
  return !!match && allowedIds.includes(match[1]);
}

    const urlParams = new URLSearchParams(window.location.search);
    const redirectUri = urlParams.get('redirect_uri');
    const redirectUriIsValid = !!redirectUri && isAllowedRedirectUri(redirectUri, ALLOWED_EXTENSION_IDS);

    firebase.auth().onAuthStateChanged(async (user) => {
      if (user) {
        if (redirectUri && !redirectUriIsValid) {
          // Fail closed: an unrecognised redirect_uri gets no tokens and no
          // "success" message either, so a real attacker's page can't rely on
          // this page reassuring the person signing in.
          document.getElementById('msg').innerText = 'This sign-in link is not valid.';
          return;
        }

        if (redirectUriIsValid) {
          document.getElementById('msg').innerText = 'Redirecting back to extension...';
          const idToken = await user.getIdToken();
          const refreshToken = user.refreshToken;
          window.location.href = `${redirectUri}?token=${encodeURIComponent(idToken)}&refreshToken=${encodeURIComponent(refreshToken)}&apiKey=${encodeURIComponent(firebaseConfig.apiKey)}`;
        } else {
          document.getElementById('msg').innerText = 'Successfully signed in! You can close this window.';
        }
      } else {
        document.getElementById('msg').innerText = 'Please sign in to continue';
        let ui = firebaseui.auth.AuthUI.getInstance() || new firebaseui.auth.AuthUI(firebase.auth());
        ui.start('#firebaseui-auth-container', {
          signInOptions: [
            firebase.auth.GoogleAuthProvider.PROVIDER_ID,
            firebase.auth.EmailAuthProvider.PROVIDER_ID
          ],
          signInFlow: 'popup',
          callbacks: {
            signInSuccessWithAuthResult: () => false
          }
        });
      }
    });
  </script>
</body>
</html>
