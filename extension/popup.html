<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Hammer</title>
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('fonts/inter.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --color-bg: #0f0f0f;
      --color-surface: rgba(22, 22, 22, 0.7);
      --color-surface-solid: #161616;
      --color-surface-offset: rgba(255, 255, 255, 0.05);
      --color-border: rgba(255, 255, 255, 0.08);
      --color-border-glow: rgba(249, 115, 22, 0.3);
      --color-text: #e8e8e8;
      --color-text-muted: #888888;
      --color-primary: #f97316;
      --color-primary-hover: #ea6c0a;
      --color-primary-bg: rgba(249, 115, 22, 0.15);
      --shadow-glow: 0 0 12px rgba(249, 115, 22, 0.2);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      padding: 16px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      color: var(--color-text);
      background: radial-gradient(circle at 50% 0%, #1e1510 0%, var(--color-bg) 60%);
      min-height: 400px;
      overflow-x: hidden;
    }
    
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    header img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, #bbb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; position: relative; }
    .tab-btn {
      flex: 1; padding: 8px 0; border: 1px solid var(--color-border); border-radius: 8px;
      background: var(--color-surface); font-size: 12px; font-weight: 600; cursor: pointer;
      color: var(--color-text-muted); transition: all 200ms ease;
      backdrop-filter: blur(8px);
    }
    .tab-btn:hover { background: var(--color-surface-offset); color: var(--color-text); }
    .tab-btn.active { 
      background: var(--color-primary-bg); 
      color: var(--color-primary); 
      border-color: var(--color-border-glow);
      box-shadow: var(--shadow-glow);
    }

    /* ── Capture panel ── */
    #capture-panel, #history-panel {
      animation: fadeIn 300ms ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .field { margin-bottom: 14px; }
    label { 
      display: block; font-size: 11px; font-weight: 600; color: var(--color-text-muted);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; 
    }
    select, input[type="text"], input[type="url"], input[type="password"], input[type="number"] {
      width: 100%; padding: 8px 10px; border: 1px solid var(--color-border);
      border-radius: 8px; font-size: 13px; background: rgba(0,0,0,0.3); color: var(--color-text);
      transition: all 200ms ease;
    }
    select:focus, input:focus { 
      outline: none; border-color: var(--color-primary); box-shadow: var(--shadow-glow); background: #000;
    }
    
    .row { display: flex; gap: 10px; margin-top: 20px; }
    button.action-btn {
      flex: 1; padding: 10px 0; border: 1px solid transparent; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 200ms ease;
    }
    #save-btn { 
      background: var(--color-surface); color: var(--color-text); border-color: var(--color-border); 
    }
    #save-btn:hover { background: var(--color-surface-offset); }
    
    #capture-btn { 
      background: linear-gradient(135deg, var(--color-primary), #d45f00); 
      color: #fff; border: none; box-shadow: 0 4px 12px rgba(249,115,22,0.3);
    }
    #capture-btn:hover { 
      transform: translateY(-1px); box-shadow: 0 6px 16px rgba(249,115,22,0.4);
    }
    #capture-btn:active { transform: translateY(1px); }

    #project-single {
      display: none; padding: 8px 10px; background: var(--color-primary-bg);
      border: 1px solid var(--color-border-glow); border-radius: 8px;
      font-size: 13px; font-weight: 600; color: var(--color-primary);
    }

    #progress-wrap {
      display: none; margin-top: 12px; height: 4px; background: rgba(255,255,255,0.1);
      border-radius: 2px; overflow: hidden;
    }
    #progress-bar {
      height: 100%; width: 0%; background: var(--color-primary); border-radius: 2px;
      transition: width 100ms linear; box-shadow: 0 0 8px var(--color-primary);
    }

    .footer { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--color-border); padding-top: 12px; }
    #settings-toggle {
      font-size: 12px; color: var(--color-text-muted); text-decoration: none;
      background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: all 150ms;
    }
    #settings-toggle:hover { color: var(--color-text); background: var(--color-surface-offset); }
    #status { margin-top: 12px; font-size: 12px; color: var(--color-text-muted); min-height: 16px; text-align: center; }

    /* ── Logged out state ── */
    #welcome-screen { display: none; text-align: center; padding: 30px 10px; }
    #welcome-screen h2 { font-size: 16px; margin-bottom: 12px; color: var(--color-primary); }
    #welcome-screen p { font-size: 13px; color: var(--color-text-muted); margin-bottom: 24px; line-height: 1.5; }
    #welcome-signin-btn { 
      width: 100%; background: linear-gradient(135deg, var(--color-primary), #d45f00);
      color: #fff; padding: 10px 0; font-size: 14px; border: none; border-radius: 8px; 
      cursor: pointer; font-weight: 600; transition: all 200ms ease; box-shadow: 0 4px 12px rgba(249,115,22,0.3);
    }
    #welcome-signin-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(249,115,22,0.4); }

    /* ── Settings panel (Glassmorphism Overlay Modal) ── */
    #settings-panel {
      display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 15, 15, 0.75); padding: 20px; z-index: 100;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.05); overflow-y: auto;
      animation: scaleIn 250ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    #settings-panel.open { display: block; }
    #settings-panel h2 {
      font-size: 14px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--color-primary); margin-bottom: 16px; 
      border-bottom: 1px solid var(--color-border); padding-bottom: 8px;
    }
    #settings-save-btn, #open-admin-btn, #auth-login-btn {
      width: 100%; padding: 10px 0; border: 1px solid transparent; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all 200ms ease;
    }
    #auth-login-btn { background: var(--color-surface); color: var(--color-text); border-color: var(--color-border); }
    #auth-login-btn:hover { background: var(--color-surface-offset); }
    #settings-save-btn { background: var(--color-primary); color: #fff; margin-top: 12px; }
    #settings-save-btn:hover { background: var(--color-primary-hover); }
    #open-admin-btn { background: var(--color-surface); color: var(--color-text); border-color: var(--color-border); margin-bottom: 16px; }
    #open-admin-btn:hover { background: var(--color-surface-offset); }

    /* ── History panel ── */
    #history-panel { display: none; margin-top: 8px; }
    .history-empty { font-size: 13px; color: var(--color-text-muted); text-align: center; padding: 30px 0; }
    .history-row {
      padding: 10px 12px; margin-bottom: 8px; background: var(--color-surface);
      border: 1px solid var(--color-border); border-radius: 8px;
      display: flex; flex-direction: column; gap: 4px;
      transition: all 150ms ease; cursor: pointer;
    }
    .history-row:hover { background: var(--color-surface-offset); border-color: rgba(255,255,255,0.15); transform: translateY(-1px); }
    .history-path {
      font-size: 12px; color: var(--color-text); font-family: monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 288px;
    }
    .history-meta { font-size: 11px; color: var(--color-text-muted); }

    /* ── Inactivity Modal ── */
    #inactivity-modal {
      display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); z-index: 1000;
      justify-content: center; align-items: center; padding: 20px;
    }
    #inactivity-modal.open { display: flex; animation: fadeIn 200ms; }
    .modal-content {
      background: var(--color-surface-solid); border: 1px solid var(--color-border);
      border-radius: 12px; padding: 20px; text-align: center; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-content h3 { font-size: 16px; font-weight: 700; color: var(--color-primary); margin-bottom: 10px; }
    .modal-content p { font-size: 13px; color: var(--color-text); margin-bottom: 20px; line-height: 1.5; }
    .modal-actions { display: flex; gap: 10px; }
    #btn-snooze { background: transparent; color: var(--color-text); border: 1px solid var(--color-border); flex: 1; padding: 10px; border-radius: 8px; font-weight:600; cursor:pointer; }
    #btn-snooze:hover { background: var(--color-surface-offset); }
    #btn-capture-now { background: var(--color-primary); color: #fff; border: none; flex: 1; padding: 10px; border-radius: 8px; font-weight:600; cursor:pointer; }
    #btn-capture-now:hover { background: var(--color-primary-hover); }
  </style>
</head>
<body>
  <header>
    <img src="icons/hammer-logo.png" alt="The Hammer Logo" />
    <h1>The Hammer</h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tab-capture">Capture</button>
    <button class="tab-btn" id="tab-history">History</button>
  </div>

  <div id="capture-panel">
    <div id="welcome-screen">
      <h2>Welcome to The Hammer</h2>
      <p>Please sign in to start capturing evidence for your projects.</p>
      <button id="welcome-signin-btn">Sign In</button>
    </div>

    <div id="capture-controls">
      <div class="field" id="project-field">
        <label for="project-select">Project</label>
        <div id="project-dropdown">
          <select id="project-select"><option value="">— loading… —</option></select>
        </div>
        <div id="project-single" aria-live="polite"></div>
      </div>

      <div class="field">
        <label for="stage-select">Stage</label>
        <select id="stage-select">
          <option value="">— select stage —</option>
          <option value="beginning">Beginning</option>
          <option value="during">During</option>
          <option value="after">After</option>
        </select>
      </div>

      <div class="field">
        <label for="tool-input">Tool / Context <span style="font-weight:400;text-transform:none">(optional)</span></label>
        <input id="tool-input" type="text" placeholder="e.g. Figma, Jira, Notion" maxlength="64" />
      </div>

      <div class="row">
        <button id="save-btn" class="action-btn">Save</button>
        <button id="capture-btn" class="action-btn">Capture Now</button>
      </div>

      <div class="row">
        <button id="snip-btn" class="action-btn">Snip</button>
        <button id="fullpage-btn" class="action-btn">Full page</button>
      </div>

      <div id="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-bar"></div>
      </div>
    </div>

    <div id="settings-panel">
      <h2>Settings</h2>
      
      <div class="field">
        <label>Account</label>
        <div id="auth-status-text" style="font-size: 13px; margin-bottom: 10px; color: var(--color-text);">Not signed in</div>
        <button id="auth-login-btn">Sign In</button>
      </div>
      <button id="open-admin-btn">Open Admin Portal</button>

      <div class="field">
        <label for="retention-input">Retention (days) <span style="font-weight:400;text-transform:none;font-size:10px">admin-managed</span></label>
        <input id="retention-input" type="number" placeholder="—" min="1" max="3650" readonly />
      </div>
      <div class="field">
        <label for="max-size-input">Max upload size (MB) <span style="font-weight:400;text-transform:none;font-size:10px">admin-managed</span></label>
        <input id="max-size-input" type="number" placeholder="—" min="1" max="50" readonly />
      </div>
      <div class="field" style="display:flex;align-items:center;gap:8px;">
        <input id="notify-input" type="checkbox" style="width:16px; height:16px;" />
        <label for="notify-input" style="text-transform:none;font-size:13px;margin-bottom:0">Show upload notifications</label>
      </div>
      <button id="settings-save-btn">Close Settings</button>
    </div>

    <p id="status"></p>

    <div class="footer">
      <button id="settings-toggle">⚙ Settings</button>
    </div>
  </div>

  <div id="history-panel">
    <div id="history-list"></div>
  </div>

  <div id="inactivity-modal">
    <div class="modal-content">
      <h3>Are you still there?</h3>
      <p>It has been 45 seconds since your last capture. Would you like to capture now?</p>
      <div class="modal-actions">
        <button id="btn-snooze">Snooze</button>
        <button id="btn-capture-now">Capture Now</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
