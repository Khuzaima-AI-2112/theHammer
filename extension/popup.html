<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Hammer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #f7f6f2;
    }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.01em; }

    /* ── Tabs (4.5) ── */
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn {
      flex: 1; padding: 6px 0; border: 1px solid #ccc; border-radius: 6px;
      background: #eee; font-size: 12px; font-weight: 600; cursor: pointer;
      color: #555; transition: background 140ms;
    }
    .tab-btn.active { background: #01696f; color: #fff; border-color: #01696f; }

    /* ── Capture panel ── */
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #555;
            margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    select, input[type="text"], input[type="url"], input[type="password"], input[type="number"] {
      width: 100%; padding: 6px 8px; border: 1px solid #ccc;
      border-radius: 6px; font-size: 14px; background: #fff;
    }
    select:focus, input:focus { outline: 2px solid #01696f; outline-offset: 1px; }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    button {
      flex: 1; padding: 8px 0; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background 140ms ease;
    }
    #save-btn         { background: #e6e4df; color: #1a1a1a; }
    #save-btn:hover   { background: #d4d1ca; }
    #capture-btn      { background: #01696f; color: #fff; }
    #capture-btn:hover { background: #0c4e54; }

    /* ── 5.16: Single-project label (shown instead of dropdown) ── */
    #project-single {
      display: none; /* shown by JS when exactly 1 project */
      padding: 6px 8px;
      background: #e8f5f5;
      border: 1px solid #b2d8d8;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #01696f;
    }

    /* ── 4.3 Progress bar ── */
    #progress-wrap {
      display: none;
      margin-top: 8px;
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: #01696f;
      border-radius: 3px;
      transition: width 100ms linear;
    }

    .footer { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
    #settings-toggle {
      font-size: 11px; color: #01696f; text-decoration: none;
      background: none; border: none; cursor: pointer; padding: 0;
    }
    #settings-toggle:hover { text-decoration: underline; }
    #status { margin-top: 10px; font-size: 12px; color: #555; min-height: 16px; text-align: center; }

    /* ── Not-configured banner (5.15) ── */
    #no-key-banner {
      display: none; margin-top: 10px; padding: 8px 10px;
      background: #fff8e1; border: 1px solid #ffe082; border-radius: 6px;
      font-size: 11px; color: #6d4c00; line-height: 1.4;
    }
    #no-key-banner button {
      flex: none; display: inline; padding: 0; background: none; border: none;
      color: #01696f; font-weight: 700; font-size: 11px; cursor: pointer; text-decoration: underline;
    }

    /* ── Settings panel (5.15) ── */
    #settings-panel {
      display: none; margin-top: 12px; padding: 10px;
      background: #fff; border: 1px solid #ddd; border-radius: 8px;
    }
    #settings-panel.open { display: block; }
    #settings-panel h2 {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: #555; margin-bottom: 8px;
    }
    #settings-panel .field { margin-bottom: 8px; }
    #settings-panel label { font-size: 11px; }
    #settings-panel input[type="text"],
    #settings-panel input[type="url"],
    #settings-panel input[type="password"],
    #settings-panel input[type="number"] { font-size: 13px; }
    #cloud-run-url[readonly] { background: #f3f3f3; color: #888; cursor: not-allowed; }
    #url-error { display: none; font-size: 11px; color: #c0392b; margin-top: 3px; }
    #settings-save-btn {
      width: 100%; padding: 7px 0; background: #01696f; color: #fff;
      border: none; border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; margin-top: 4px;
    }
    #settings-save-btn:hover { background: #0c4e54; }

    /* ── 4.5 History panel ── */
    #history-panel { display: none; margin-top: 4px; }
    .history-empty { font-size: 12px; color: #999; text-align: center; padding: 20px 0; }
    .history-row {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
      display: flex; flex-direction: column; gap: 2px;
    }
    .history-row:last-child { border-bottom: none; }
    .history-path {
      font-size: 11px; color: #1a1a1a;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 288px;
    }
    .history-meta { font-size: 10px; color: #999; }

    /* ── Inactivity Modal (6.5) ── */
    #inactivity-modal {
      display: none;
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center; align-items: center;
      padding: 16px;
    }
    #inactivity-modal.open { display: flex; }
    .modal-content {
      background: #fff; border-radius: 8px; padding: 16px;
      text-align: center; width: 100%;
    }
    .modal-content h3 { font-size: 14px; font-weight: 700; color: #01696f; margin-bottom: 8px; }
    .modal-content p { font-size: 12px; color: #555; margin-bottom: 16px; line-height: 1.4; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions button { flex: 1; padding: 8px 0; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 140ms ease; }
    #btn-snooze { background: #e6e4df; color: #1a1a1a; }
    #btn-snooze:hover { background: #d4d1ca; }
    #btn-capture-now { background: #01696f; color: #fff; }
    #btn-capture-now:hover { background: #0c4e54; }
  </style>
</head>
<body>
  <h1>🔨 The Hammer</h1>

  <!-- 4.5: tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-capture">Capture</button>
    <button class="tab-btn" id="tab-history">History</button>
  </div>

  <!-- Capture panel -->
  <div id="capture-panel">

    <!--
      5.16: Project field.
      #project-dropdown — shown when >1 project (user must choose).
      #project-single   — shown when exactly 1 project (read-only label, dropdown hidden).
      Both controlled by populateProjectSelect() in popup.js.
    -->
    <div class="field" id="project-field">
      <label for="project-select">Project</label>
      <div id="project-dropdown">
        <select id="project-select"><option value="">— loading… —</option></select>
      </div>
      <!-- 5.16: auto-selected single project label -->
      <div id="project-single" aria-live="polite"></div>
    </div>

    <!-- 5.16: Stage dropdown (Beginning / During / After) -->
    <div class="field">
      <label for="stage-select">Stage</label>
      <select id="stage-select">
        <option value="">— select stage —</option>
        <option value="beginning">Beginning</option>
        <option value="during">During</option>
        <option value="after">After</option>
      </select>
    </div>

    <div class="field">
      <label for="tool-input">Tool / Context <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <input id="tool-input" type="text" placeholder="e.g. Figma, Jira, Notion" maxlength="64" />
    </div>

    <!-- 5.15: shown when User has not signed in -->
    <div id="no-key-banner">
      Sign in to The Hammer to start capturing.
      <button id="open-settings-banner">Sign In</button>
    </div>

    <div class="row">
      <button id="save-btn">Save</button>
      <button id="capture-btn">Capture Now</button>
    </div>

    <!-- 4.3: progress bar -->
    <div id="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progress-bar"></div>
    </div>

    <!-- Settings panel (5.15) -->
    <div id="settings-panel">
      <h2>Settings</h2>
      <div class="field">
        <label for="cloud-run-url">Backend URL</label>
        <input id="cloud-run-url" type="url" readonly
               value="https://app.thehammer.io/api"
               title="Managed by admin config — not editable here." />
        <p id="url-error">URL must start with https://</p>
      </div>
      <div class="field">
        <label>Account</label>
        <div id="auth-status-text" style="font-size: 12px; margin-bottom: 8px;">Not signed in</div>
        <button id="auth-login-btn" style="width:100%; padding: 6px 0; background: #e6e4df; border:none; border-radius:4px; cursor:pointer;">Sign In</button>
      </div>
      <div class="field">
        <label for="retention-input">Retention (days) <span style="font-weight:400;text-transform:none;font-size:10px">admin-managed</span></label>
        <input id="retention-input" type="number" placeholder="—" min="1" max="3650" readonly />
      </div>
      <div class="field">
        <label for="max-size-input">Max upload size (MB) <span style="font-weight:400;text-transform:none;font-size:10px">admin-managed</span></label>
        <input id="max-size-input" type="number" placeholder="—" min="1" max="50" readonly />
      </div>
      <div class="field" style="display:flex;align-items:center;gap:8px;">
        <input id="notify-input" type="checkbox" style="width:auto" />
        <label for="notify-input" style="text-transform:none;font-size:12px;margin-bottom:0">Show upload notifications</label>
      </div>
      <button id="settings-save-btn">Close Settings</button>
    </div>

    <p id="status"></p>

    <div class="footer">
      <button id="settings-toggle">⚙ Settings</button>
    </div>
  </div>

  <!-- 4.5: history panel -->
  <div id="history-panel">
    <div id="history-list"></div>
  </div>

  <!-- Inactivity Modal (6.5) -->
  <div id="inactivity-modal">
    <div class="modal-content">
      <h3>Are you still there?</h3>
      <p>It has been 45 seconds since your last capture. Would you like to capture now?</p>
      <div class="modal-actions">
        <button id="btn-snooze">Snooze</button>
        <button id="btn-capture-now">Capture Now</button>
      </div>
    </div>
  </div>

  <!-- MV3: no inline scripts -->
  <script src="popup.js"></script>
</body>
</html>
