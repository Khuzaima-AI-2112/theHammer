<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Hammer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #f7f6f2;
    }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 14px; letter-spacing: -0.01em; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    select, input {
      width: 100%; padding: 6px 8px; border: 1px solid #ccc;
      border-radius: 6px; font-size: 14px; background: #fff;
    }
    select:focus, input:focus { outline: 2px solid #01696f; outline-offset: 1px; }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    button {
      flex: 1; padding: 8px 0; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background 140ms ease;
    }
    #save-btn         { background: #e6e4df; color: #1a1a1a; }
    #save-btn:hover   { background: #d4d1ca; }
    #capture-btn      { background: #01696f; color: #fff; }
    #capture-btn:hover { background: #0c4e54; }
    .footer { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
    #admin-link, #settings-toggle {
      font-size: 11px; color: #01696f; text-decoration: none;
      background: none; border: none; cursor: pointer; padding: 0;
    }
    #admin-link:hover, #settings-toggle:hover { text-decoration: underline; }
    #status {
      margin-top: 10px; font-size: 12px; color: #555; min-height: 16px;
      text-align: center;
    }
    /* First-run banner */
    #seed-banner {
      display: none;
      margin-top: 10px;
      padding: 8px 10px;
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 6px;
      font-size: 11px;
      color: #6d4c00;
      line-height: 1.4;
    }
    #seed-banner button {
      flex: none;
      display: inline;
      padding: 0;
      background: none;
      border: none;
      color: #01696f;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
    }
    /* Settings panel (task 2.13) */
    #settings-panel {
      display: none;
      margin-top: 12px;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    #settings-panel.open { display: block; }
    #settings-panel h2 {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: #555; margin-bottom: 8px;
    }
    #settings-panel .field { margin-bottom: 8px; }
    #settings-panel label { font-size: 11px; }
    #settings-panel input { font-size: 13px; }
    #url-error {
      display: none;
      font-size: 11px;
      color: #c0392b;
      margin-top: 3px;
    }
    #settings-save-btn {
      width: 100%; padding: 7px 0; background: #01696f; color: #fff;
      border: none; border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; margin-top: 4px;
    }
    #settings-save-btn:hover { background: #0c4e54; }
  </style>
</head>
<body>
  <h1>🔨 The Hammer</h1>

  <div class="field">
    <label for="project-select">Project</label>
    <select id="project-select"><option value="">— select —</option></select>
  </div>

  <div class="field">
    <label for="user-select">User</label>
    <select id="user-select"><option value="">— select —</option></select>
  </div>

  <div class="field">
    <label for="tool-input">Tool / Context <span style="font-weight:400;text-transform:none">(optional)</span></label>
    <input id="tool-input" type="text" placeholder="e.g. Figma, Jira, Notion" maxlength="64" />
  </div>

  <!-- First-run notice — shown by popup.js -->
  <div id="seed-banner">
    Using sample data. <button id="open-admin-banner">Open Admin</button> to add your real projects and users.
  </div>

  <div class="row">
    <button id="save-btn">Save</button>
    <button id="capture-btn">Capture Now</button>
  </div>

  <!-- Settings panel (task 2.13) — hidden by default -->
  <div id="settings-panel">
    <h2>Settings</h2>
    <div class="field">
      <label for="cloud-run-url">Cloud Run URL</label>
      <input id="cloud-run-url" type="url" placeholder="https://...run.app" />
      <p id="url-error">URL must start with https://</p>
    </div>
    <div class="field">
      <label for="api-key-input">API Key</label>
      <input id="api-key-input" type="password" placeholder="••••••••" autocomplete="off" />
    </div>
    <button id="settings-save-btn">Save Settings</button>
  </div>

  <p id="status"></p>

  <div class="footer">
    <button id="admin-link">⚙ Admin</button>
    <button id="settings-toggle">⚙ Settings</button>
  </div>

  <!-- MV3: no inline scripts — all logic in popup.js -->
  <script src="popup.js"></script>
</body>
</html>
