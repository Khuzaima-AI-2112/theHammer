substitutions:
  # Extension ids allowed to reach the backend (CORS, backend/src/index.js) and
  # to receive tokens from the portal's sign-in redirect (portal/auth-ext.html,
  # #80). One value, two consumers.
  #
  # One id, not a list, since #36: extension/manifest.json declares the public
  # key the id is derived from, so every unpacked copy on every machine gets
  # this same id. The list this replaced held one entry per developer folder
  # (#54) and could only ever grow. The manifest key and this value must move
  # together; extension/tests/manifest-key.test.js checks them against each
  # other — but nothing runs that check automatically. The test step below runs
  # only the backend suite (dir: backend, npm test), and the pre-commit hook
  # (scripts/install-git-hook.ps1) runs the same one. The extension and portal
  # suites are local and manual, so this pairing is guarded by a test somebody
  # has to remember to run: npm run test:extension, after touching either half.
  #
  # Still space-separated if a second id is ever genuinely needed: gcloud's
  # --set-env-vars splits pairs on commas, so a comma here truncates the value
  # silently (lesson 63).
  _EXTENSION_IDS: 'bnlcomhbnaecjjifmlpfilpohejhckmh'

steps:
  # ── 1. Run backend tests with Firestore emulator ────────────────────────────
  - name: 'node:22-alpine'
    id: 'test'
    dir: 'backend'
    entrypoint: sh
    args:
      - '-c'
      - |
        # Fail on the first bad command. Without this the step ran on after a
        # failed install and reported `firebase: not found`, which named
        # neither the failure nor its cause (build 75c1a140).
        set -euo pipefail
        # openjdk21-jre, not 17: the Firestore emulator is a Java program and
        # firebase-tools refuses to start it below Java 21
        # (MIN_SUPPORTED_JAVA_MAJOR_VERSION in lib/emulator/commandUtils.js).
        apk add --no-cache openjdk21-jre
        # firebase-tools comes from backend/package.json, pinned (#9). It used
        # to be `npm install -g firebase-tools`, which resolved a fresh latest
        # on every build: a release could break the deploy with nobody having
        # touched the repo, and the version that built an image was not
        # recorded anywhere.
        #
        # `npm install`, not `npm ci`, and not for want of trying. ci is the
        # right primitive — it enforces the lockfile rather than merely
        # honouring it — but build 75c1a140 failed on it:
        #
        #   npm error `npm ci` can only install packages when your package.json
        #   and package-lock.json are in sync.
        #   npm error Missing: @emnapi/core@1.11.3 from lock file
        #
        # package-lock.json is generated on Windows, where npm resolves only
        # this platform's optional dependencies, so it does not carry the
        # linux-x64 ones this container needs. `npm install --package-lock-only`
        # on Windows does not add them either. Making ci work means generating
        # the lockfile on Linux; until somebody does that, ci fails every build
        # and install succeeds. Do not swap this back without fixing the
        # lockfile first (#9).
        npm install
        npm run test:emulator
    env:
      # No FIRESTORE_EMULATOR_HOST here, deliberately: emulators:exec exports it
      # to the process it runs, taking the port from firebase.json, which is the
      # only place that port is declared (#57).
      - 'NODE_ENV=test'

  # ── 3. Build backend image ──────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    waitFor: ['test']
    args:
      - 'build'
      - '-t'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'
      - 'backend/'

  # ── 4. Push backend image ───────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args:
      - 'push'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'

  # ── 4a. Local Smoke Test ────────────────────────────────────────────────────
  # Runs the backend container locally and hits it before deploying to Cloud Run.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'smoke-test-local'
    waitFor: ['push-backend']
    entrypoint: bash
    args:
      - 'backend/tests/smoke-test.sh'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'

  # ── 5. Deploy backend to Cloud Run ─────────────────────────────────────────
  #
  # --allow-unauthenticated: Must be enabled because the Node.js application 
  # handles all identity verification natively via Firebase ID Tokens in an 
  # Authorization: Bearer header (checked by the requireAuth middleware). 
  # If this is set to no-allow, the Google Front End (GFE) will reject 
  # all client traffic with a 401/403.
  #
  # Sprint 9 Note on Binary Authorization (Task 9.12):
  # Binary Authorization enforcement via `--binary-authorization` has been
  # intentionally left out for now. Enabling it would block ad-hoc
  # deployments from developer machines (e.g., desktop deploys), which
  # the team prefers to maintain. 
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    waitFor: ['smoke-test-local']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'thehammer-backend'
      - '--image'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'
      - '--region'
      - 'northamerica-northeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '5'
      - '--memory'
      - '512Mi'
      - '--timeout'
      - '300s'
      - '--service-account'
      - 'thehammer-backend@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'NODE_ENV=production,GCS_BUCKET=thehammer-storage-2026,EXTENSION_ID=$_EXTENSION_IDS,ADMIN_ORIGIN=https://thehammer-portal-282689937365.northamerica-northeast1.run.app,SHOTSTACK_ENV=v1'
      # SHOTSTACK_API_KEY (#90) is a real third-party credential, never a
      # plain env var — infra/add-shotstack-secret.ps1 provisions the
      # `shotstack-api-key` secret and the backend SA's read access to it;
      # this just points Cloud Run at it.
      #
      # INTERNAL_SECRET (#105) is the shared secret POST /reports/generate
      # presents to the worker routes. It was set nowhere at all until now, so
      # the backend ran on the 'dev-secret' literal its code fell back to —
      # published in this repository, on an --allow-unauthenticated service,
      # and the internal path is exempt from #104's Workspace ownership check.
      # infra/add-internal-secret.ps1 provisions it. One flag carries both:
      # --set-secrets replaces the whole set rather than adding to it.
      - '--set-secrets'
      - 'SHOTSTACK_API_KEY=shotstack-api-key:latest,INTERNAL_SECRET=internal-worker-secret:latest'

  # ── 5a. Inject backend URL into Portal ──────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'inject-backend-url'
    waitFor: ['deploy-backend']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        BACKEND_URL=$(gcloud run services describe thehammer-backend \
          --region northamerica-northeast1 --format 'value(status.url)')
        echo "Injecting backend URL: $$BACKEND_URL"
        # No /api prefix: the backend mounts every route at the root (#26, #31).
        sed -i "s|__BACKEND_API_URL__|$$BACKEND_URL|g" portal/app.js

  # ── 5b. Inject allowed extension ids into Portal ────────────────────────────
  # auth-ext.html validates redirect_uri against this list before handing out
  # Firebase tokens (#80). Same list the backend just deployed with — one
  # source of truth, declared in `substitutions:` above.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'inject-extension-ids'
    waitFor: ['deploy-backend']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "Injecting extension ids: $_EXTENSION_IDS"
        sed -i "s|__EXTENSION_IDS__|$_EXTENSION_IDS|g" portal/auth-ext.html

  # ── 6. Build portal image ───────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-portal'
    waitFor: ['inject-backend-url', 'inject-extension-ids']
    args:
      - 'build'
      - '-t'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/portal:$COMMIT_SHA'
      - 'portal/'

  # ── 7. Push portal image ────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-portal'
    waitFor: ['build-portal']
    args:
      - 'push'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/portal:$COMMIT_SHA'

  # ── 8. Deploy portal to Cloud Run ──────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-portal'
    waitFor: ['push-portal']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'thehammer-portal'
      - '--image'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/portal:$COMMIT_SHA'
      - '--region'
      - 'northamerica-northeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--memory'
      - '128Mi'
      - '--timeout'
      - '10s'
      - '--service-account'
      - 'thehammer-portal-sa@$PROJECT_ID.iam.gserviceaccount.com'

  # ── 9. Smoke test ───────────────────────────────────────────────────────────
  # Runs after both deploys complete. Fetches an identity token for the Cloud
  # Build SA, then calls /health on each service. A non-200 from either service
  # fails the build — Cloud Run keeps the previous revision at 100% traffic.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-test'
    waitFor: ['deploy-backend', 'deploy-portal']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail

        SA_EMAIL=$$(gcloud config get-value account)

        BACKEND_URL=$$(gcloud run services describe thehammer-backend \
          --region northamerica-northeast1 --format 'value(status.url)')

        PORTAL_URL=$$(gcloud run services describe thehammer-portal \
          --region northamerica-northeast1 --format 'value(status.url)')

        echo "── backend: $$BACKEND_URL"
        TOKEN_BACKEND=$$(gcloud auth print-identity-token --impersonate-service-account="$$SA_EMAIL" --audiences="$$BACKEND_URL" --include-email)
        STATUS=$$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $$TOKEN_BACKEND" "$$BACKEND_URL/health")
        echo "   /health → $$STATUS"
        [ "$$STATUS" = "200" ] || { echo "FAIL: backend /health returned $$STATUS"; exit 1; }

        echo "── portal: $$PORTAL_URL"
        TOKEN_PORTAL=$$(gcloud auth print-identity-token --impersonate-service-account="$$SA_EMAIL" --audiences="$$PORTAL_URL" --include-email)
        STATUS=$$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $$TOKEN_PORTAL" "$$PORTAL_URL/health")
        echo "   /health → $$STATUS"
        [ "$$STATUS" = "200" ] || { echo "FAIL: portal /health returned $$STATUS"; exit 1; }

        echo "Smoke test passed ✓"

images:
  - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'
  - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/portal:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
