steps:
  # ── 1. Run backend tests with Firestore emulator ────────────────────────────
  - name: 'node:22-alpine'
    id: 'test'
    dir: 'backend'
    entrypoint: sh
    args:
      - '-c'
      - |
        apk add --no-cache openjdk21-jre
        npm install -g firebase-tools
        npm install
        firebase emulators:exec --only firestore --project demo-hammer 'npm test'
    env:
      - 'NODE_ENV=test'
      - 'FIRESTORE_EMULATOR_HOST=127.0.0.1:8080'

  # ── 3. Build backend image ──────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    waitFor: ['test']
    args:
      - 'build'
      - '-t'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'
      - 'backend/'

  # ── 4. Push backend image ───────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args:
      - 'push'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'

  # ── 4a. Local Smoke Test ────────────────────────────────────────────────────
  # Runs the backend container locally and hits it before deploying to Cloud Run.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'smoke-test-local'
    waitFor: ['push-backend']
    entrypoint: bash
    args:
      - 'backend/tests/smoke-test.sh'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'

  # ── 5. Deploy backend to Cloud Run ─────────────────────────────────────────
  #
  # --allow-unauthenticated: Must be enabled because the Node.js application 
  # handles all identity verification natively via Firebase ID Tokens and 
  # X-Api-Key headers (checked by requireAuth / requireApiKey middlewares). 
  # If this is set to no-allow, the Google Front End (GFE) will reject 
  # all client traffic with a 401/403.
  #
  # Sprint 9 Note on Binary Authorization (Task 9.12):
  # Binary Authorization enforcement via `--binary-authorization` has been
  # intentionally left out for now. Enabling it would block ad-hoc
  # deployments from developer machines (e.g., desktop deploys), which
  # the team prefers to maintain. 
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    waitFor: ['smoke-test-local']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'thehammer-backend'
      - '--image'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'
      - '--region'
      - 'northamerica-northeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '5'
      - '--memory'
      - '512Mi'
      - '--timeout'
      - '300s'
      - '--service-account'
      - 'thehammer-backend@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'NODE_ENV=production,GCS_BUCKET=thehammer-storage-2026,EXTENSION_ID=ndmbjlbmcdlmijglkfcelbiejmghiikm,ADMIN_ORIGIN=https://thehammer-portal-282689937365.northamerica-northeast1.run.app'

  # ── 5a. Inject backend URL into Portal ──────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'inject-backend-url'
    waitFor: ['deploy-backend']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        BACKEND_URL=$(gcloud run services describe thehammer-backend \
          --region northamerica-northeast1 --format 'value(status.url)')
        echo "Injecting backend URL: $$BACKEND_URL"
        sed -i "s|__BACKEND_API_URL__|$$BACKEND_URL/api|g" portal/app.js

  # ── 6. Build portal image ───────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-portal'
    waitFor: ['inject-backend-url']
    args:
      - 'build'
      - '-t'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/portal:$COMMIT_SHA'
      - 'portal/'

  # ── 7. Push portal image ────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-portal'
    waitFor: ['build-portal']
    args:
      - 'push'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/portal:$COMMIT_SHA'

  # ── 8. Deploy portal to Cloud Run ──────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-portal'
    waitFor: ['push-portal']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'thehammer-portal'
      - '--image'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/portal:$COMMIT_SHA'
      - '--region'
      - 'northamerica-northeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--memory'
      - '128Mi'
      - '--timeout'
      - '10s'
      - '--service-account'
      - 'thehammer-portal-sa@$PROJECT_ID.iam.gserviceaccount.com'

  # ── 9. Smoke test ───────────────────────────────────────────────────────────
  # Runs after both deploys complete. Fetches an identity token for the Cloud
  # Build SA, then calls /health on each service. A non-200 from either service
  # fails the build — Cloud Run keeps the previous revision at 100% traffic.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-test'
    waitFor: ['deploy-backend', 'deploy-portal']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail

        SA_EMAIL=$$(gcloud config get-value account)

        BACKEND_URL=$$(gcloud run services describe thehammer-backend \
          --region northamerica-northeast1 --format 'value(status.url)')

        PORTAL_URL=$$(gcloud run services describe thehammer-portal \
          --region northamerica-northeast1 --format 'value(status.url)')

        echo "── backend: $$BACKEND_URL"
        TOKEN_BACKEND=$$(gcloud auth print-identity-token --impersonate-service-account="$$SA_EMAIL" --audiences="$$BACKEND_URL" --include-email)
        STATUS=$$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $$TOKEN_BACKEND" "$$BACKEND_URL/health")
        echo "   /health → $$STATUS"
        [ "$$STATUS" = "200" ] || { echo "FAIL: backend /health returned $$STATUS"; exit 1; }

        echo "── portal: $$PORTAL_URL"
        TOKEN_PORTAL=$$(gcloud auth print-identity-token --impersonate-service-account="$$SA_EMAIL" --audiences="$$PORTAL_URL" --include-email)
        STATUS=$$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $$TOKEN_PORTAL" "$$PORTAL_URL/health")
        echo "   /health → $$STATUS"
        [ "$$STATUS" = "200" ] || { echo "FAIL: portal /health returned $$STATUS"; exit 1; }

        echo "Smoke test passed ✓"

images:
  - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'
  - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/portal:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
