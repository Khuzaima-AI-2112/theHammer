steps:
  # ── 1. Start Firestore emulator ────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'start-firestore-emulator'
    entrypoint: bash
    args:
      - '-c'
      - |
        apt-get install -y default-jre-headless --quiet
        npm install -g firebase-tools --quiet
        firebase emulators:start --only firestore --project demo-hammer &
        echo "Waiting for Firestore emulator..."
        sleep 10
        echo "Emulator ready."
    env:
      - 'FIRESTORE_EMULATOR_HOST=127.0.0.1:8080'

  # ── 2. Run backend tests ────────────────────────────────────────────────────
  - name: 'node:20-alpine'
    id: 'test'
    waitFor: ['start-firestore-emulator']
    dir: 'backend'
    entrypoint: sh
    args:
      - '-c'
      - 'npm ci && npm test'
    env:
      - 'NODE_ENV=test'
      - 'FIRESTORE_EMULATOR_HOST=127.0.0.1:8080'

  # ── 3. Build backend image ──────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    waitFor: ['test']
    args:
      - 'build'
      - '-t'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'
      - 'backend/'

  # ── 4. Push backend image ───────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args:
      - 'push'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'

  # ── 5. Deploy backend to Cloud Run ─────────────────────────────────────────
  #
  # --no-allow-unauthenticated: Cloud Run IAM blocks all requests that do not
  # carry a valid Google identity token. The extension and portal authenticate
  # via X-Api-Key (checked by requireApiKey / requireAdmin middleware), but
  # Cloud Run itself still requires a valid invoker identity. The Cloud Build
  # service account (thehammer-backend@) is granted roles/run.invoker so the
  # smoke test step below can reach the service.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    waitFor: ['push-backend']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'thehammer-backend'
      - '--image'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'
      - '--region'
      - 'northamerica-northeast1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--memory'
      - '256Mi'
      - '--timeout'
      - '30s'
      - '--service-account'
      - 'thehammer-backend@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-secrets'
      - 'API_KEY=thehammer-api-key:latest'
      - '--set-env-vars'
      - 'NODE_ENV=production,GCS_BUCKET=thehammer-storage-2026'

  # ── 6. Build portal image ───────────────────────────────────────────────────
  # Runs in parallel with the backend build — only needs tests to pass.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-portal'
    waitFor: ['test']
    args:
      - 'build'
      - '-t'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/portal:$COMMIT_SHA'
      - 'portal/'

  # ── 7. Push portal image ────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-portal'
    waitFor: ['build-portal']
    args:
      - 'push'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/portal:$COMMIT_SHA'

  # ── 8. Deploy portal to Cloud Run ──────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-portal'
    waitFor: ['push-portal']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'thehammer-portal'
      - '--image'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/portal:$COMMIT_SHA'
      - '--region'
      - 'northamerica-northeast1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--memory'
      - '128Mi'
      - '--timeout'
      - '10s'
      - '--service-account'
      - 'thehammer-backend@$PROJECT_ID.iam.gserviceaccount.com'

  # ── 9. Smoke test ───────────────────────────────────────────────────────────
  # Runs after both deploys complete. Fetches an identity token for the Cloud
  # Build SA, then calls /health on each service. A non-200 from either service
  # fails the build — Cloud Run keeps the previous revision at 100% traffic.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-test'
    waitFor: ['deploy-backend', 'deploy-portal']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail

        TOKEN=$(gcloud auth print-identity-token)

        BACKEND_URL=$(gcloud run services describe thehammer-backend \
          --region northamerica-northeast1 --format 'value(status.url)')

        PORTAL_URL=$(gcloud run services describe thehammer-portal \
          --region northamerica-northeast1 --format 'value(status.url)')

        echo "── backend: $BACKEND_URL"
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer $TOKEN" \
          "$BACKEND_URL/health")
        echo "   /health → $STATUS"
        [ "$STATUS" = "200" ] || { echo "FAIL: backend /health returned $STATUS"; exit 1; }

        echo "── portal: $PORTAL_URL"
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer $TOKEN" \
          "$PORTAL_URL/health")
        echo "   /health → $STATUS"
        [ "$STATUS" = "200" ] || { echo "FAIL: portal /health returned $STATUS"; exit 1; }

        echo "Smoke test passed ✓"

images:
  - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/backend:$COMMIT_SHA'
  - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/thehammer/portal:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
